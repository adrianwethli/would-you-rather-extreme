name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # "write" is needed only so the test APK can be published as a GitHub release (last step).
      contents: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Publishes one stable download link for the newest test build:
      # https://github.com/<owner>/<repo>/releases/download/test-latest/WouldYouRatherExtreme-test.apk
      # Only runs for pushes to main (not for pull requests).
      - name: Publish the test APK as a GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk WouldYouRatherExtreme-test.apk
          NOTES="Test version for trying the game (adults only, 18+). Built from commit ${GITHUB_SHA::7}. It contains a simulated 'Unlock Premium (test)' button that charges nothing. This is not the public release."
          gh release delete test-latest --cleanup-tag --yes || true
          gh release create test-latest WouldYouRatherExtreme-test.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Test version (latest)" \
            --notes "$NOTES"

      - name: Upload reports if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports/
          retention-days: 7
